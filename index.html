<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>El Reino de Orión</title>
        <link rel="manifest" href="manifest.json">
        <link rel="stylesheet" href="css/intro.css">
        <link rel="stylesheet" href="css/main.css">
    </head>
    <body>
        <section id="introScreen">
            <div id="background"></div>
            <div id="overlay"></div>
            <div class="crawl-container">
                <div id="crawl" class="crawl"></div>
            </div>
            <button id="startButton">
                ⚔️ Comenzar la aventura
            </button>
            <audio
                id="introMusic"
                src="sounds/intro.mp3">
            </audio>
        </section>
        <section id="gameScreen" style="display:none;">
            <header class="profile">
                <div class="avatar">
                    <img src="images/characters/explorer.jpg" alt="Orión">
                </div>
                <div class="info">
                    <h2 id="playerName">Orión</h2>
                    <p id="playerRank">Explorador</p>
                    <div class="level">
                        ⭐ Nivel
                        <span id="playerLevel">1</span>
                    </div>
                    <div class="xpBar">
                        <div id="xpFill" class="xpFill"></div>
                        <div class="level">
                            ⭐ Nivel
                            <span id="playerLevel">1</span>
                        </div>
                        <p>
                            XP:
                            <span id="playerXP">0</span> /
                            <span id="playerNextXP">100</span>
                        </p>
                        <div class="xpBar">
                            <div id="xpFill" class="xpFill"></div>
                        </div>
                        <h3>
                            🪙
                            <span id="playerCoins">0</span>
                            Oquos
                        </h3>
                    </div>
                </div>        
            </header>
            <nav id="mainMenu">
                <button id="btnMapa">
                    🗺️
                    <span>Mapa</span>
                </button>
                <button id="btnMisiones">
                    📜
                    <span>Misiones</span>
                </button>
                <button id="btnMercado">
                    🛒
                    <span>Mercado</span>
                </button>
                <button id="btnLogros">
                    🏆
                    <span>Logros</span>
                </button>
            </nav>
            <main id="content">
              
            </main>
        </section>
        <script src="js/navigation.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/storage.js"></script>
        <script src="js/rewards.js"></script>
        <script src="js/parent.js"></script>
        <script src="js/missions.js"></script>
        <script src="js/intro.js"></script>
        <script src="js/calendar.js"></script>
        <script src="js/app.js"></script>
        <script>cargarMisiones();</script>
    </body>
</html>
